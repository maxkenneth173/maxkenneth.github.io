<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Portal del Sol - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">PORTAL DEL SOL</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Servicios y Menú</a></li>
                <li><a href="reservaciones.html">Reservaciones</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title animated-fade">Área de Clientes</h2>
        
        <div class="form-container animated-fade delay-1" style="max-width: 450px;">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="tuusuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" style="color: var(--accent-color); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
            </form>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="#" style="color: var(--accent-color); font-weight: bold; text-decoration: none;">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hotel Portal del Sol. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
