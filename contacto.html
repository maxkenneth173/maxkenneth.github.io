<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Portal del Sol - Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">PORTAL DEL SOL</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Servicios y Menú</a></li>
                <li><a href="reservaciones.html">Reservaciones</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title animated-fade">Ponte en Contacto</h2>
        
        <div class="form-container animated-fade delay-1">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Escribe tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="Escribe tu correo" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" class="form-control" placeholder="¿En qué podemos ayudarte?" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" class="form-control" placeholder="Escribe tus comentarios o dudas aquí..." required></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hotel Portal del Sol. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
